apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.reguard.app"
    compileSdk = 34

    defaultConfig {
        applicationId "com.reguard.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    // WebSocket client for EmgMonitorService's native connection to the
    // brace (ws://<ip>:81/) -- the platform has no built-in high-level
    // WebSocket API, and this is the de facto standard for it on Android.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
